  "detail": "<script>\n$(function () {\n    if (window.location.pathname == '/account/register') {\n        let baseUrl = 'https://design.momuto.com';\n        let uuid = localStorage.getItem('3duuid');\n        if (!uuid) {\n            sendRequestApi('/uuid', {}, 'GET').then(res => {\n                if (res.code == 200) {\n                    uuid = res.uuid;\n                    localStorage.setItem('3duuid', uuid);\n                }\n            })\n        }\n\n        function sendRequestApi(url = \"\", params = {}, method = 'POST', async = true) {\n            var request_url = baseUrl + url;\n            var randstr = Math.round(Math.random() * 1000000000 + 1000000000);\n            params.timestamp = parseInt(Date.parse(new Date()) / 1000);\n            params.ranstr = randstr;\n            return $.ajax({\n                type: method, url: request_url, data: params, dataType: \"json\", async: async, success: function (res) {\n                    if (res.code == 1) {\n                        return res;\n                    } else {\n                        return false;\n                    }\n                }, error: function (res) {\n                }\n            });\n        }\n\n        $('#register').hide();\n        let register_html = `<style>.border_red{border-bottom: 1px solid red !important;}</style><div id=\"registerForSlim\" class=\"main_btn form_btn\">REGISTER</div>`;\n        $('#register-form > div:nth-child(9) > div').append(register_html);\n    }\n    let offset = true;\n    $('body').delegate('#registerForSlim', 'click', function () {\n        if (!offset) {\n            return false;\n        }\n        let first_name = $('#first_name').val();\n        if (!first_name) {\n            $('#first_name').addClass('border_red');\n        } else {\n            $('#first_name').removeClass('border_red');\n        }\n        let last_name = $('#last_name').val();\n        if (!first_name) {\n            $('#last_name').addClass('border_red');\n        } else {\n            $('#last_name').removeClass('border_red');\n        }\n        let email = $('#email').val();\n        const regEmail = /^([a-zA-Z0-9_-])+@([a-zA-Z0-9_-])+(\\.[a-zA-Z0-9_-])+/\n        if (!email || !regEmail.test(email)) {\n            $('#email').addClass('border_red');\n        } else {\n            $('#email').removeClass('border_red');\n        }\n        let password = $('#first_name').val();\n        if (!password) {\n            $('#password').addClass('border_red');\n        } else {\n            $('#password').removeClass('border_red');\n        }\n        if (first_name && last_name && email && password) {\n            offset = false;\n            let params = {\n                firstName: first_name,\n                lastName: last_name,\n                email: email,\n                password: password,\n                accountType: '',\n                salutationId: '',\n                vatIds: '',\n                billingAddress: {company: '', department: ''},\n                uuid: uuid\n            };\n            sendRequestApi('/doRegister', params).then(res => {\n                offset = true;\n                if (res.code != 200) {\n                    alert(res.message);\n                    return false;\n                }\n                $('#register').click();\n            })\n        }\n    })\n})\n</script>",
