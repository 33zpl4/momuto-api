<script>
(function() {
  // Listado de URLs que no deben ser indexadas
  var noIndexPages = [
    '/pages/design-personnalise-confirme',
    '/products/maillot-momuto-basket-pro',
    '/products/jersey-basic_ce02cd19',

  ];

  var currentPath = window.location.pathname;

  // Si la ruta actual está en la lista, añadir meta tag
  if (noIndexPages.indexOf(currentPath) !== -1) {
    var meta = document.createElement('meta');
    meta.name = "robots";
    meta.content = "noindex, nofollow";
    document.getElementsByTagName('head')[0].appendChild(meta);
    console.log("SEO: No-Index activado para esta página.");
  }
})();
</script>
