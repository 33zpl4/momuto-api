<style>
/* ============================================================
   MOMUTO HERO v3 — Premium Brand Block
   Fonts: Bebas Neue (headlines) + Outfit (body/UI)
   Full-width breakout via calc(-50vw + 50%)
   ============================================================ */
 
/* Full width breakout */
.momuto-hero-container {
    position: relative;
    width: 100vw !important;
    margin-left: calc(-50vw + 50%) !important;
    margin-right: calc(-50vw + 50%) !important;
    max-width: 100vw !important;
    left: 0 !important;
    right: 0 !important;
    min-height: 100vh;
    background: linear-gradient(135deg, #000 0%, #0a0a0a 40%, #111 60%, #0a0a0a 80%, #000 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    z-index: 1;
}
 
/* Prevent horizontal scroll */
body, html {
    overflow-x: hidden;
}
 
/* Subtle radial glow */
.momuto-hero-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 70% 45%, rgba(180, 180, 190, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 70%, rgba(140, 145, 160, 0.05) 0%, transparent 45%),
                radial-gradient(ellipse at 20% 50%, rgba(200, 53, 46, 0.06) 0%, transparent 50%);
    z-index: 1;
    pointer-events: none;
}
 
/* Grain texture */
.momuto-hero-container::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 2;
}
 
/* Main grid — 1400px max to match site container */
.momuto-hero-grid {
    display: grid;
    grid-template-columns: 2fr 3fr;
    width: 100%;
    flex: 1;
    align-items: center;
    position: relative;
    z-index: 10;
    max-width: 1400px;
    margin: 0 auto;
}
 
/* ---- LEFT: Text content ---- */
.momuto-hero-text {
    padding: 0 4rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: white;
}
 
.momuto-hero-label {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #6b6b6b;
    margin-bottom: 1.75rem;
    opacity: 0;
    animation: momutoFadeUp 0.8s ease forwards 0.2s;
}
 
.momuto-hero-label::before {
    content: '';
    display: inline-block;
    width: 32px;
    height: 1px;
    background: #c8352e;
}
 
.momuto-hero-h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 7.5vw, 7.5rem);
    font-weight: 400; /* Bebas Neue only has 400 — it's already bold by design */
    line-height: 0.92;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin-bottom: 1.75rem;
    color: #f5f5f5;
    opacity: 0;
    animation: momutoFadeUp 0.8s ease forwards 0.4s;
}
 
.momuto-hero-h1 em {
    font-style: normal;
    color: #c8352e;
    display: block;
}
 
.momuto-hero-p {
    font-family: 'Outfit', sans-serif;
    font-size: 1.1rem;
    font-weight: 300;
    line-height: 1.7;
    color: #d4d4d8;
    max-width: 480px;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: momutoFadeUp 0.8s ease forwards 0.6s;
}
 
.momuto-hero-ctas {
    display: flex;
    gap: 1.25rem;
    align-items: center;
    opacity: 0;
    animation: momutoFadeUp 0.8s ease forwards 0.8s;
}
 
.momuto-hero-ctas .btn-primary {
    background: #c8352e;
    color: white;
    padding: 1.1rem 2.5rem;
    border: 1px solid #c8352e;
    border-radius: 0;
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
}
 
.momuto-hero-ctas .btn-primary:hover {
    background: #e04038;
    transform: translateY(-2px);
}
 
.momuto-hero-ctas .btn-primary svg {
    width: 16px;
    height: 16px;
    transition: transform 0.3s;
}
 
.momuto-hero-ctas .btn-primary:hover svg {
    transform: translateX(4px);
}
 
.momuto-hero-ctas .btn-link {
    color: #d4d4d8;
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    position: relative;
    padding-bottom: 4px;
    transition: color 0.3s;
}
 
.momuto-hero-ctas .btn-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background: #d4d4d8;
    opacity: 0.25;
    transition: opacity 0.3s;
}
 
.momuto-hero-ctas .btn-link:hover {
    color: #fff;
}
 
.momuto-hero-ctas .btn-link:hover::after {
    opacity: 0.7;
}
 
/* ---- RIGHT: Image triptych ---- */
.momuto-hero-images {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    justify-content: center;
    height: 100vh;
    padding: 80px 2rem 60px;
    position: relative;
}
 
.momuto-hero-imgwrap {
    position: relative;
    flex: 0 0 auto;
    overflow: hidden;
    opacity: 0;
}
 
.momuto-hero-imgwrap:nth-child(1) {
    width: 240px;
    height: 70%;
    align-self: center;
    animation: momutoImgReveal 1s ease forwards 0.3s;
}
 
.momuto-hero-imgwrap:nth-child(2) {
    width: 270px;
    height: 82%;
    align-self: flex-end;
    animation: momutoImgReveal 1s ease forwards 0.5s;
}
 
.momuto-hero-imgwrap:nth-child(3) {
    width: 240px;
    height: 66%;
    align-self: center;
    animation: momutoImgReveal 1s ease forwards 0.7s;
}
 
.momuto-hero-imgwrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(12%) contrast(1.05);
    transition: filter 0.5s ease, transform 0.6s ease;
}
 
.momuto-hero-imgwrap:hover img {
    filter: grayscale(0%) contrast(1.1);
    transform: scale(1.03);
}
 
/* ---- VALUE BAR ---- */
.momuto-value-bar {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 3.5rem;
    padding: 2rem 3rem 2.5rem;
    border-top: 1px solid rgba(255,255,255,0.05);
    background: rgba(17,17,17,0.6);
    backdrop-filter: blur(8px);
}
 
.momuto-value-item {
     padding: 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: momutoFadeUp 0.6s ease forwards;
}
 
.momuto-value-item:nth-child(1) { animation-delay: 1s; }
.momuto-value-item:nth-child(2) { animation-delay: 1.1s; }
.momuto-value-item:nth-child(3) { animation-delay: 1.2s; }
.momuto-value-item:nth-child(4) { animation-delay: 1.3s; }
 
.momuto-value-icon {
    width: 34px;
    height: 34px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
 
.momuto-value-icon svg {
    width: 14px;
    height: 14px;
    stroke: #c8352e;
    fill: none;
    stroke-width: 1.5;
}
 
.momuto-value-text {
    font-family: 'Outfit', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #d4d4d8;
    opacity: 0.6;
}
 
/* ---- ANIMATIONS ---- */
@keyframes momutoFadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}
 
@keyframes momutoImgReveal {
    from { opacity: 0; transform: translateY(36px); }
    to   { opacity: 1; transform: translateY(0); }
}
 
/* ---- RESPONSIVE: TABLET ---- */
@media (max-width: 1024px) {
    .momuto-hero-grid {
        grid-template-columns: 1fr;
        padding: 2rem;
        height: auto;
    }
 
    .momuto-hero-container {
        height: auto;
        min-height: 85vh;
    }
 
    .momuto-hero-text {
        padding: 2rem 1rem 0;
        order: 1;
    }
 
    .momuto-hero-images {
        order: 2;
        height: 50vh;
        padding: 2rem 1rem;
    }
 
    .momuto-hero-imgwrap:nth-child(1),
    .momuto-hero-imgwrap:nth-child(3) { width: 26vw; }
    .momuto-hero-imgwrap:nth-child(2) { width: 30vw; }
 
    .momuto-value-bar {
        flex-wrap: wrap;
        gap: 1.25rem 2.5rem;
        padding: 1.75rem 2rem;
    }
}
 
/* ---- MOBILE: Replace triptych with peek carousel ---- */
@media (max-width: 768px) {
    .momuto-hero-container {
        min-height: auto;
        padding: 0;
    }

    .momuto-hero-grid {
        grid-template-columns: 1fr;
        padding: 0 0 1rem;
        gap: 0;
    }

    /* Images FIRST */
    .momuto-hero-images {
        order: -1;
        height: auto;
        padding: 0;
        gap: 0;
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        justify-content: flex-start;
        align-items: stretch;
    }

    .momuto-hero-images::-webkit-scrollbar {
        display: none;
    }

    .momuto-hero-imgwrap {
        flex: 0 0 82%;
        height: 56vh;
        min-height: 320px;
        max-height: 480px;
        scroll-snap-align: start;
        margin-right: 6px;
        opacity: 1;
        animation: none;
        align-self: auto;
        width: auto !important;
    }

    .momuto-hero-imgwrap:first-child {
        margin-left: 16px;
    }

    .momuto-hero-imgwrap:last-child {
        margin-right: 16px;
    }

    .momuto-hero-imgwrap img {
        filter: none;
    }

    /* Carousel dots */
    .momuto-carousel-dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 12px 0 4px;
    }

    .momuto-carousel-dots .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255,255,255,0.2);
        transition: all 0.3s ease;
    }

    .momuto-carousel-dots .dot.active {
        background: #c8352e;
        width: 20px;
        border-radius: 3px;
    }

    /* Text section */
    .momuto-hero-text {
        padding: 1.25rem 1.25rem 1.5rem;
        text-align: left;
        order: 1;
    }

    .momuto-hero-label {
        margin-bottom: 0.75rem;
    }

    .momuto-hero-h1 {
        font-size: clamp(3rem, 12vw, 4rem);
        margin-bottom: 0.75rem;
    }

    .momuto-hero-p {
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
        line-height: 1.5;
    }

    .momuto-hero-ctas {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
    }

    .momuto-hero-ctas .btn-primary {
        width: 100%;
        justify-content: center;
        padding: 1.1rem 2rem;
    }

    .momuto-hero-ctas .btn-link {
        text-align: center;
    }

    .momuto-value-bar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        padding: 0;
        border-top: 1px solid rgba(255,255,255,0.06);
        padding-bottom: 8px;

    }

    .momuto-value-item {
        justify-content: center;
        padding: 14px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        border-right: 1px solid rgba(255,255,255,0.04);
    }

    .momuto-value-item:nth-child(2n) {
        border-right: none;
    }

    .momuto-value-item:nth-child(n+3) {
        border-bottom: none;
    }

    .momuto-value-icon {
        display: none;
    }

    .momuto-value-text {
        color: #ffffff;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        opacity: 0.7;
        text-align: center;
    }
}

/* Hide dots on desktop */
.momuto-carousel-dots {
    display: none;
}
</style>
