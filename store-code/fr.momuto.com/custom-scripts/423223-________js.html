<script>

    function syncAjaxRequestWithRetry(url, maxRetries, async) {
        var retries = 0;

        function makeRequest() {
            var response = $.ajax({ url: url, type: 'GET', dataType: 'json', async: async });
            if (response.status === 200) {
                return response.responseText
            } else {
                console.log(response);
                retries++;
                if (retries <= maxRetries) {
                    console.log('Request failed. Retrying... (Attempt ' + retries + ')');
                    return makeRequest()
                } else {
                    console.log('Max retries exceeded. Request failed.');
                    return null
                }
            }
        }

        return makeRequest()
    }
