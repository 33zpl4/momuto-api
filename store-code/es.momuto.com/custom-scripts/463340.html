  "detail": "<style>\n    @media screen and (min-width: 768px) {\n        .product_detail_default .product-warp .product-right .product-name{text-align: left;}\n        .product_detail_default .product-info-describe{text-align: left !important;}\n        .product_preview_bigtiledown .swiper-slide{width: 100%;}\n    }\n    .product-cart-group {\n        flex-direction: row;\n        flex-wrap: wrap;\n    }\n    \n    .control-product_detail-cart {\n        width: 100% !important;\n        color: #fff;\n        background: #E2214B;\n        border: 1px solid #E2214B;\n        flex:none !important;\n        border-radius: 3px;\n    }\n    \n    .control-product_detail-cart:hover {\n        background: #E2214B;\n        color: var(--main_button_color);\n    }\n    \n    .control-product_detail-buy {\n        width: 100% !important;\n        color: #fff !important ;\n        background: #1d1f21;\n        margin-top: 10px;\n        flex:none !important;\n        border-radius: 3px;\n    }\n    \n    #goto3d {\n        width: 100% !important;\n        color: #fff !important;\n        background: #E2214B !important;\n        margin-top: 10px;\n        flex:none !important;\n        border-radius: 3px;\n    }\n    .product-price-market{display:none !important;}\n    .main_btn{\n        background: #1d1f21 !important;\n        margin-top:10px !important;\n    }\n      /* .sku-cell{\n        display: none;\n    } */\n    \n    \n    \n    @media screen and (min-width: 821px) {\n        div.swiper-container ul {\n            display: grid;\n            grid-template-columns: 1fr 1fr; /* 两列，宽度相等 */\n            grid-gap: 10px; /* 元素之间的间距 */\n            justify-items: center; /* 水平居中对齐 */\n        }\n    \n       \n    }\n    #mo-quantity{width:100%;background: #1d1f21 !important;border-radius: 3px;display: flex;justify-content:space-between;}\n    #mo-quantity .product-calculator-handle{width:16px;font-size: 20px;color:#fff;}\n    .product-calculator-value{margin:0 10px !important;background: #fff; height:28px;top:7px;line-height: 28px !important;}\n    #plugin-product-price{display: none;}\n    #sku-option-584207 > div > div.product-sku > div:nth-child(5){display: none;}\n    .price_append{width:60px;height:44px;line-height: 44px;overflow: hidden;font-size: 16px;text-align:right;color:#fff;margin:0px;}\n    .price_append2{width:100px;margin:0px;text-align:left;padding-right: 10px;}\n    .price_append2 span{font-weight: bold;}\n    #sku-option-584207 > div > div.product-sku > div:nth-child(8){margin-top:10px !important;}\n    #goto3d{background: #F9423A !important;margin-top: 0 !important;}\n    #addToCart{margin-top:20px !important;margin-bottom: 10px;background: #1d1f21 !important;border:none !important;font-size:14px;}\n    #addToCart:hover{color:#fff !important;}\n    #mo-quantity > div:nth-child(2){margin-left: 30px;}\n    #mo-quantity > div:nth-child(4){margin-right: 30px;}\n    \n    \n    /* Product title */\n    \n    .product_detail_default .product-info-subtitle {\n        text-align: left; \n        font-weight: 800;\n    }\n    \n    @media screen and (max-width: 480px) {\n        img, video {\n      max-width: 100%;\n      height: auto;\n    }\n    html, body {\n      overflow-x: hidden;\n    }\n    \n    .product_detail_default .product-info-describe {\n        text-align: justify;\n        }\n    .product_detail_default .product-info-subtitle {\n        font-weight: 800;\n        }\n    }\n       \n    \n    </style>",
