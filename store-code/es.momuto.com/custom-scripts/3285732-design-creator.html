        }

        if (secondaryColor) {
            secondaryColor.addEventListener('input', () => {
                updateColorPreview('secondaryColor', 'secondaryPreview', 'secondaryHex');
            });
        }

        if (accentColor) {
            accentColor.addEventListener('input', () => {
                updateColorPreview('accentColor', 'accentPreview', 'accentHex');
            });
        }

        // Set up intensity slider
        const intensitySlider = document.getElementById('intensitySlider');
        if (intensitySlider) {
            intensitySlider.addEventListener('input', (e) => {
                updateIntensity(e.target.value);
            });
        }

        // Set up style selection
        document.querySelectorAll('.style-option').forEach(option => {
            option.addEventListener('click', function() {
                const style = this.dataset.style;
                if (style) {
                    selectStyle(style);
                }
            });
        });

        // Set up reference image upload
        const referenceImage = document.getElementById('referenceImage');
        if (referenceImage) {
            referenceImage.addEventListener('change', function() {
                handleReferenceImage(this);
            });
        }

        // Set up accent toggle
        const accentToggle = document.getElementById('accentToggle');
        if (accentToggle) {
            accentToggle.addEventListener('click', toggleAccent);
        }

        // Set up generate button
        const generateBtn = document.getElementById('generateBtn');
        if (generateBtn) {
            generateBtn.addEventListener('click', generateJersey);
        }

        // Initialize default values
        updateIntensity(intensityValue);
        updateColorPreview('primaryColor', 'primaryPreview', 'primaryHex');
        updateColorPreview('secondaryColor', 'secondaryPreview', 'secondaryHex');
        updateColorPreview('accentColor', 'accentPreview', 'accentHex');

        console.log("Jersey Designer functionality initialized successfully");
    }

    // Run the code once DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeJerseyDesigner);
    } else {
        initializeJerseyDesigner();
    }
}
</script>
