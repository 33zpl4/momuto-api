<script>
    window.onload = function() {
        var subscribeInput = document.getElementById('newsletter-input');
        if(subscribeInput ){
          var parentElement = subscribeInput.parentElement;
        
        // create wrapping div
        var wrapDiv = document.createElement('div');
        wrapDiv.className = 'input-wrap';

        // create the join button
        var btn = document.createElement('button');
        btn.type = 'submit';
        btn.textContent = 'Join';
        btn.className = 'submit-btn';

        // append both input and button to the wrapping div
        wrapDiv.appendChild(subscribeInput);
        wrapDiv.appendChild(btn);

        // append the wrapping div to the parent element
        parentElement.appendChild(wrapDiv);
}
        
    }
</script>
