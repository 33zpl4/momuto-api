  "detail": "<style>\n/* Simplified product recommendation selectors */\n.productrec-item > div {\n    display: flex; \n    align-items: baseline;\n}\n\n.productrec-item > div > a {\n    flex: 1;\n}\n\n.productrec-wrap .productrec-swiper .productrec-item .product-price .original-price {\n    display: none;\n}\n\n@media screen and (min-width: 1200px) {\n    .page-header .header_box_wrap .header_box .nav {\n        margin-left: 20px;\n    }\n    .page-header .header_box_wrap .header_box .action-icon {\n        margin-right: 20px;\n    }\n}\n\n/* Nav font declarations */\n.page-header .header_box_wrap .header_box .nav a {\n    font-size: 14px;\n    font-family: 'Jost', sans-serif !important;\n    font-weight: 500 !important;\n    line-height: 24px;\n}\n\n.mobile_nav a {\n    font-size: 14px;\n    font-family: 'Jost', sans-serif !important;\n    font-weight: 500 !important;\n    line-height: 24px;\n}\n\n.mobile_nav .panel-menu-item {\n    font-size: 14px;\n    font-family: 'Jost', sans-serif !important;\n    font-weight: 500 !important;\n    line-height: 24px;\n}\n\na.account_icon.login {\n    display: none !important;\n}\n\n/* Commented out the problematic mobile menu rule - test if this fixes the issue */\n/* #card-header > div.mobile_menu_card.open > div.mobile_menu_wrap > div > div > div > ul > li:nth-child(4){display: none !important;} */\n\n/* If you need to hide a specific menu item, use a more semantic approach like: */\n/* .mobile-menu-item.hidden-item { display: none !important; } */\n/* --- Mobile menu overlap fix (public.js uses left:-260px) --- */\n\n/* Ensure the main UL doesn't rely on its inline left shift */\n.mobile_nav .panel-menu-ul.only-warp-menu {\n  left: 0 !important;\n  transition: transform .25s ease;\n  will-change: transform;\n}\n\n/* Any time the script sets a negative left (ex: -260px), shift by full panel width */\n.mobile_nav .panel-menu-ul.only-warp-menu[style*=\"left: -\"] {\n  transform: translateX(-100%) !important;\n}\n\n/* Safety: submenu panels should sit to the right, not stack on top */\n.mobile_nav .panel-menu-ul.only-ul-left100 {\n  left: 100% !important;\n}\n</style>",
