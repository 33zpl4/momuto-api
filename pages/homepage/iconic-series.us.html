<!-- ============================================================================
     MOMUTO homepage block — EN translation
     "The Iconic Series" — in-house limited-edition collection (3-card grid +
     hover front/back swap). CSS / structure IDENTICAL to the FR original
     (iconic-series.fr.html); only the copy and alt text are translated.

     Links carry over unchanged — the product/collection handles are already
     English and relative:
       /products/im-01-the-volley, /products/im-03-the-run,
       /products/im-05-the-116th, /collections/iconic-football-series
     (Confirm these products/collection exist on momuto.com before going live.)
     ============================================================================ -->

<!-- Font import — skip if already loaded above -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  .iconic-section {
    background: #0a0a0a;
    padding: 5rem 1.5rem;
    width: 100vw;
    position: relative;
    left: 50%;
    margin-left: -50vw;
    box-sizing: border-box;
  }

  .iconic-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  .iconic-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 1.5rem;
    margin-bottom: 3rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .iconic-header-left {}

  .iconic-eyebrow {
    font-family: 'Outfit', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    margin: 0 0 0.5rem;
  }

  .iconic-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: 0.04em;
    color: #fff;
    margin: 0;
    line-height: 1;
  }

  .iconic-view-all {
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }

  .iconic-view-all:hover {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.6);
  }

  .iconic-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  @media (max-width: 700px) {
    .iconic-grid {
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .iconic-card--hide-mobile {
      display: none;
    }
  }

  .iconic-card {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .iconic-card-image {
    aspect-ratio: 3 / 4;
    background: #111;
    position: relative;
    overflow: hidden;
  }

  .iconic-swap {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .iconic-swap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 1rem;
    transition: opacity 0.5s ease, transform 0.8s ease;
  }

  .iconic-swap .back {
    opacity: 1;
    transform: scale(1);
  }

  .iconic-swap .front {
    opacity: 0;
    transform: scale(1.03);
  }

  .iconic-card:hover .iconic-swap .front {
    opacity: 1;
    transform: scale(1);
  }

  .iconic-card:hover .iconic-swap .back {
    opacity: 0;
  }

  .iconic-card-meta {
    padding: 1.25rem 0 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .iconic-ref {
    font-family: 'Outfit', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    margin: 0 0 0.35rem;
  }

  .iconic-name {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 1.4rem;
    letter-spacing: 0.04em;
    color: #fff;
    transition: color 0.2s;
  }

  .iconic-card:hover .iconic-name {
    color: rgba(255, 255, 255, 0.65);
  }

  .iconic-price {
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.6);
    padding-top: 1.25rem;
  }

  .iconic-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .iconic-footer-desc {
    font-family: 'Outfit', sans-serif;
    font-size: 0.875rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.4);
    max-width: 480px;
    line-height: 1.6;
  }

  .iconic-footer-cta {
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 0.75rem 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }

  .iconic-footer-cta:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.5);
  }
</style>

<section class="iconic-section">

            <img class="front" src="https://cdn.staticsoe.com/pics/a9b76c07663ec0331fd5ca37ef680779faf6c8db6abc7fe566f3fb1955401d45.webp" alt="The Volley – front">

          </div>
        </div>
        <div class="iconic-card-meta">
          <div>
            <p class="iconic-ref">IM–03</p>

      <!-- IM-05 The 116th (signature) -->
      <a href="/products/im-05-the-116th" class="iconic-card iconic-card--hide-mobile">
        <div class="iconic-card-image">
          <div class="iconic-swap">
            <img class="back" src="https://cdn.staticsoe.com/pics/bb5ba3700cc0fa32e9b14983ba80d08325ac8c7af3bfce934afb9e4baf7117af.webp" alt="The 116th – back">
            <img class="front" src="https://cdn.staticsoe.com/pics/b7a508a7a76222f10cd65518f93fecaa2a92ee234ed41f73a83af52f374383bf.webp" alt="The 116th – front">
          </div>
        </div>
        <div class="iconic-card-meta">
          <div>
            <p class="iconic-ref">IM–05 · Signature</p>
            <p class="iconic-name">THE 116TH</p>
          </div>
          <span class="iconic-price">$45.90</span>

      </a>

    </div>

    <div class="iconic-footer">
      <p class="iconic-footer-desc">
        Soccer's iconic moments, reimagined as wearable art. Limited editions, designed in-house.
      </p>
      <a href="/collections/iconic-football-series" class="iconic-footer-cta">EXPLORE THE COLLECTION</a>
    </div>

  </div>
</section>
