name: Deploy Kit Gallery Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/custom-kit-gallery.html'
      - 'pages/galeria-equipaciones-personalizadas'
      - 'pages/galerie-maillots-foot-sur-mesure'
      - 'pages/galleria-maglie-personalizzate'
      - 'scripts/deploy-kit-gallery-pages.js'
      - '.github/workflows/deploy-kit-gallery-pages.yml'
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated locales to deploy (en,es,fr,it)'
        required: false
        default: 'en,es,fr,it'
      dry_run:
        description: 'Dry run (do not write to CMS)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy kit gallery pages
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          LOCALES: ${{ inputs.locales || 'en,es,fr,it' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/deploy-kit-gallery-pages.js
