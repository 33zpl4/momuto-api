name: Export Page from CMS

# Pulls live CMS page(s) into the repo (body + SEO meta) and commits them back.
#
# Two ways to run — both reusable for any handle on any locale/subdomain:
#   • BULK (no clicks): edit sync/export-manifest.json and push to main.
#     Every entry is exported automatically. Driven by push, so it needs no
#     manual dispatch.
#   • SINGLE: dispatch with a handle/locale for a one-off pull.

on:
  push:
    branches: [main]
    paths:
      - 'sync/export-manifest.json'
      - 'scripts/export-page.js'
  workflow_dispatch:
    inputs:
      handle:
        description: 'Page handle (e.g. zentral-opiniones-alternativa)'
        required: true
        type: string
      locale:
        description: 'Locale / subdomain'
        required: true
        default: 'es'
        type: choice
        options: [en, es, fr, it]
      outfile:
        description: 'Output path (optional; default pages/export-<handle>)'
        required: false
        type: string
      branch:
        description: 'Branch to commit to'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export from CMS
        id: export
        env:
          MANIFEST: ${{ github.event_name == 'push' && 'sync/export-manifest.json' || '' }}
          HANDLE: ${{ inputs.handle }}
          LOCALE: ${{ inputs.locale }}
          OUTFILE: ${{ inputs.outfile }}
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
        run: node scripts/export-page.js

      - name: Commit exported files
        if: steps.export.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
          FILES: ${{ steps.export.outputs.files }}
        run: |
          for FILE in $FILES; do
            [ -f "$FILE" ] || { echo "missing $FILE"; continue; }
            CONTENT=$(base64 -w 0 "$FILE")
            SHA=$(gh api "repos/${{ github.repository }}/contents/${FILE}?ref=${BRANCH}" --jq '.sha' 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/${{ github.repository }}/contents/${FILE}" \
                -f message="Export from CMS: ${FILE} [skip ci]" \
                -f content="$CONTENT" -f sha="$SHA" -f branch="$BRANCH"
            else
              gh api --method PUT "repos/${{ github.repository }}/contents/${FILE}" \
                -f message="Export from CMS: ${FILE} [skip ci]" \
                -f content="$CONTENT" -f branch="$BRANCH"
            fi
            echo "✓ Committed ${FILE} to ${BRANCH}"
          done
