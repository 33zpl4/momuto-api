name: Pull CMS Content

# Fetches a single CMS object (post / page / product) into the repo so it can be
# edited locally and redeployed. The sync commit is marked [skip ci].
#   post    → blogs/<locale>/<handle>.json   (curated, round-trips via Deploy Blog Post)
#   page    → cms/pages/<locale>/<handle>.json     (full raw object)
#   product → cms/products/<locale>/<handle>.json  (full raw object)

on:
  # Click-free: append a request line to .github/pull-queue.txt and push. Format:
  #   "<type> <locale> <handle>"   e.g. "page fr request-..."  /  "product fr the-fracture"
  #   "<locale> <handle>"          shorthand → type defaults to post
  # The runner (which has CMS network + secrets, unlike the sandbox) fetches the
  # object from the LAST non-comment line and commits it back, marked [skip ci].
  push:
    branches: [main]
    paths:
      - '.github/pull-queue.txt'
  workflow_dispatch:
    inputs:
      cms_type:
        description: 'Content type'
        required: false
        default: 'post'
        type: choice
        options: [post, page, product]
      handle:
        description: 'CMS url handle (or numeric id) to pull'
        required: true
      locale:
        description: 'Site locale'
        required: false
        default: 'fr'
        type: choice
        options: [en, fr, es, it]

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve target (push = last queue line, dispatch = inputs)
        id: tgt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ github.event.inputs.cms_type }}"; LOC="${{ github.event.inputs.locale }}"; H="${{ github.event.inputs.handle }}"
          else
            LINE="$(grep -vE '^[[:space:]]*(#|$)' .github/pull-queue.txt | tail -1 || true)"
            read -r A B C <<< "$LINE"
            case "$A" in
              post|page|product) TYPE="$A"; LOC="$B"; H="$C" ;;
              "")                TYPE="";    LOC="";   H=""  ;;
              *)                 TYPE="post"; LOC="$A"; H="$B" ;;
            esac
          fi
          [ -z "$TYPE" ] && TYPE="post"
          [ -z "$H" ] && { echo "No active request in queue — nothing to pull."; echo "skip=true" >> "$GITHUB_OUTPUT"; }
          echo "type=$TYPE"   >> "$GITHUB_OUTPUT"
          echo "locale=$LOC"  >> "$GITHUB_OUTPUT"
          echo "handle=$H"    >> "$GITHUB_OUTPUT"

      - name: Pull from CMS
        if: steps.tgt.outputs.skip != 'true'
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          CMS_TYPE: ${{ steps.tgt.outputs.type }}
          LOCALE:   ${{ steps.tgt.outputs.locale }}
          HANDLE:   ${{ steps.tgt.outputs.handle }}
        run: node scripts/pull-cms.js

      - name: Commit pulled file
        if: steps.tgt.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs cms 2>/dev/null || git add blogs
          if git diff --cached --quiet; then
            echo "No changes — ${{ steps.tgt.outputs.type }} already in sync."
            exit 0
          fi
          git commit -m "Pull ${{ steps.tgt.outputs.type }} ${{ steps.tgt.outputs.handle }} (${{ steps.tgt.outputs.locale }}) from CMS [skip ci]"
          git pull --rebase origin main
          git push
