name: Pull CMS Content

# Fetches CMS objects (post / page / product) into the repo so they can be edited
# and redeployed. The sync commit is marked [skip ci].
#   post    → blogs/<locale>/<handle>.json   (curated, round-trips via Deploy Blog Post)
#   page    → cms/pages/<locale>/<handle>.json     (full raw object)
#   product → cms/products/<locale>/<handle>.json  (full raw object)

on:
  # Click-free: list one request per line in .github/pull-queue.txt and push.
  # ALL non-comment lines are pulled in a single run. Line format:
  #   "<type> <locale> <handle>"   e.g. "page fr request-..."  /  "product fr the-fracture"
  #   "<locale> <handle>"          shorthand → type defaults to post
  # The runner (which has CMS network + secrets, unlike the sandbox) fetches each
  # object and commits them back, marked [skip ci].
  push:
    branches: [main]
    paths:
      - '.github/pull-queue.txt'
  workflow_dispatch:
    inputs:
      cms_type:
        description: 'Content type'
        required: false
        default: 'post'
        type: choice
        options: [post, page, product, inventory, dump]
      handle:
        description: 'CMS url handle (or numeric id) to pull'
        required: true
      locale:
        description: 'Site locale'
        required: false
        default: 'fr'
        type: choice
        options: [en, fr, es, it, us]

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build request list (push = all queue lines, dispatch = inputs)
        id: tgt
        run: |
          Q="$RUNNER_TEMP/queue.txt"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ github.event.inputs.cms_type }} ${{ github.event.inputs.locale }} ${{ github.event.inputs.handle }}" > "$Q"
          else
            grep -vE '^[[:space:]]*(#|$)' .github/pull-queue.txt > "$Q" || true
          fi
          N=$(grep -cvE '^[[:space:]]*$' "$Q" || true)
          echo "queue=$Q" >> "$GITHUB_OUTPUT"
          if [ "${N:-0}" -eq 0 ]; then echo "No active requests — nothing to pull."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Pull from CMS
        if: steps.tgt.outputs.skip != 'true'
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          OEMSAAS_TOKEN_US: ${{ secrets.OEMSAAS_TOKEN_US }}
        run: |
          while read -r A B C; do
            [ -z "$A" ] && continue
            case "$A" in
              inventory|dump)    T="$A"; L="$B"; H="-" ;;
              post|page|product) T="$A"; L="$B"; H="$C" ;;
              *)                 T="post"; L="$A"; H="$B" ;;
            esac
            [ -z "$H" ] && continue
            echo "::group::pull $T $L $H"
            CMS_TYPE="$T" LOCALE="$L" HANDLE="$H" node scripts/pull-cms.js || echo "  (failed: $T $L $H)"
            echo "::endgroup::"
          done < "${{ steps.tgt.outputs.queue }}"

      - name: Commit pulled files
        if: steps.tgt.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs cms 2>/dev/null || git add blogs
          if git diff --cached --quiet; then
            echo "No changes — already in sync."
            exit 0
          fi
          git commit -m "Pull $(git diff --cached --name-only | wc -l | tr -d ' ') CMS object(s) from CMS [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
