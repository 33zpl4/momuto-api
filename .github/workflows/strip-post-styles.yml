name: Strip Inline CSS from Blog Posts

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Store to clean'
        required: true
        default: 'it'
        type: choice
        options:
          - it
          - en
          - es
          - fr
      dry_run:
        description: 'Dry run — report only, no writes'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      post_handle:
        description: 'Restrict to one post handle (blank = all posts)'
        required: false
        default: ''

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Strip inline styles
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          STORE: ${{ github.event.inputs.store }}
          POST_HANDLE: ${{ github.event.inputs.post_handle }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/strip-post-styles.js
