name: Unpublish Posts

# Takes CMS blog posts out of publication without touching their content.
# The list lives in cms/unpublish.json. Each post is archived to
# cms/unpublished/<locale>/<handle>.json before it is flipped, and the archive
# is committed back [skip ci].
#
# Dispatch-only on purpose: unpublishing is destructive to visibility, so it
# should never fire from a push. Run with dry_run=true first and read the log.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no writes)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      locale:
        description: 'Restrict to one locale (blank = all declared)'
        required: false
        default: ''
        type: choice
        options: ['', en, fr, es, it, us]

permissions:
  contents: write

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpublish
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LOCALE: ${{ github.event.inputs.locale }}
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          OEMSAAS_TOKEN_US: ${{ secrets.OEMSAAS_TOKEN_US }}
        run: node scripts/unpublish-posts.js

      - name: Commit archives
        if: github.event.inputs.dry_run == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cms/unpublished 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No archives to commit."
            exit 0
          fi
          git commit -m "Archive $(git diff --cached --name-only | wc -l | tr -d ' ') unpublished post(s) [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
