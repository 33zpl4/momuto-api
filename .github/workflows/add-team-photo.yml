name: Add Team Photo to Gallery

# Adds a real team's photo to the "Teams that trust MOMUTO" page on ALL FIVE stores
# (EN teams-clubs-momuto, US twin, ES equipos-momuto, FR equipes-clubs-momuto, IT squadre-club-momuto).
# One row goes into teams/photos.json, scripts/build-teams-pages.js rebuilds the five page objects from it,
# the pages are deployed through scripts/deploy-cms-page.js (full-object PUT) and the sources are committed.
#
#   1. Upload the photo in the store's media library (CMS) and copy its https URL.
#   2. Run this workflow with dry_run ticked first, then again without.
#
# Live steps (deploy + commit) run ONLY from main; from any other branch the run is a dry run.
# NOT the custom-kit gallery (that one is the team-kit pipeline, see ADD_TEAM.md). Docs: docs/teams-clubs-page.md

on:
  workflow_dispatch:
    inputs:
      team_name:
        description: 'Team name (e.g. "Atletico Guanche")'
        required: true
        type: string
      image_url:
        description: 'https URL of the team photo (upload it in the CMS media library, copy the link)'
        required: true
        type: string
      country:
        description: 'Country of the team (filter button + structured data)'
        required: true
        type: choice
        default: ES
        options: [ES, FR, IT, DE, GB, US, DK, PT, BE, NL, SE, CH]
      league:
        description: 'League or competition (e.g. "Superliga LPGC")'
        required: true
        type: string
      place_en:
        description: 'City / area, English (e.g. "Las Palmas"). Used for any language you leave empty.'
        required: true
        type: string
      place_es:
        description: 'City / area, Spanish (optional)'
        required: false
        type: string
      place_fr:
        description: 'City / area, French (optional)'
        required: false
        type: string
      place_it:
        description: 'City / area, Italian (optional)'
        required: false
        type: string
      region:
        description: 'Optional sub-filter key (canarias, madrid, aragon, vizcaya, or a new one). A region gets its own filter button once it has 3 photos.'
        required: false
        type: string
      dry_run:
        description: 'Dry run: check the photo URL and show what would be added, change nothing'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  add-photo:
    runs-on: ubuntu-latest
    env:
      LIVE: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Say it plainly when a live run is downgraded
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: echo "::notice::Not on main — this run is a dry run (nothing is deployed or committed). Run the workflow from main to publish."

      - name: Add the photo to teams/photos.json
        env:
          TEAM_NAME: ${{ inputs.team_name }}
          IMAGE_URL: ${{ inputs.image_url }}
          COUNTRY: ${{ inputs.country }}
          LEAGUE: ${{ inputs.league }}
          PLACE_EN: ${{ inputs.place_en }}
          PLACE_ES: ${{ inputs.place_es }}
          PLACE_FR: ${{ inputs.place_fr }}
          PLACE_IT: ${{ inputs.place_it }}
          REGION: ${{ inputs.region }}
          DRY_RUN: ${{ env.LIVE != 'true' }}
        run: node scripts/add-team-photo.js

      - name: Rebuild the five pages (checks only on a dry run)
        run: |
          if [ "$LIVE" = "true" ]; then node scripts/build-teams-pages.js; else node scripts/build-teams-pages.js --check; fi

      - name: Deploy the five pages to the CMS
        if: ${{ env.LIVE == 'true' }}
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          OEMSAAS_TOKEN_US: ${{ secrets.OEMSAAS_TOKEN_US }}
          DRY_RUN: 'false'
          CHANGED_FILES: cms/pages/en/teams-clubs-momuto.json cms/pages/us/teams-clubs-momuto.json cms/pages/es/equipos-momuto.json cms/pages/fr/equipes-clubs-momuto.json cms/pages/it/squadre-club-momuto.json
        run: |
          if git diff --quiet -- teams/photos.json; then echo "Photo was already listed — nothing to deploy."; exit 0; fi
          node scripts/deploy-cms-page.js

      - name: Commit the sources to main
        if: ${{ env.LIVE == 'true' }}
        run: |
          if git diff --quiet -- teams/photos.json; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teams/photos.json cms/pages/en/teams-clubs-momuto.json cms/pages/us/teams-clubs-momuto.json cms/pages/es/equipos-momuto.json cms/pages/fr/equipes-clubs-momuto.json cms/pages/it/squadre-club-momuto.json
          git commit -m "Teams page: add ${{ inputs.team_name }} (all five stores) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
