name: Create Team Proposal Pages

on:
  push:
    paths:
      - 'teams/*/config.json'
      - 'scripts/generate-and-deploy.js'
  workflow_dispatch:
    inputs:
      team_slug:
        description: 'Team slug (folder name under teams/)'
        required: true
        type: string
      update_gallery:
        description: 'Also update gallery?'
        required: false
        default: 'false'
        type: string

jobs:
  create-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk@0.39.0

      - name: Find changed team configs
        id: changed
        run: |
          if [ -n "${{ inputs.team_slug }}" ]; then
            echo "team=${{ inputs.team_slug }}" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep 'teams/.*/config.json' | head -1)
            echo "config=$CHANGED" >> $GITHUB_OUTPUT
            TEAM=$(echo $CHANGED | cut -d'/' -f2)
            echo "team=$TEAM" >> $GITHUB_OUTPUT
            if [ -z "$TEAM" ]; then
              echo "No team config changed — skipping deploy"
            fi
          fi

      - name: Check if gallery update requested
        id: gallery
        run: |
          if [ -n "${{ inputs.update_gallery }}" ] && [ "${{ inputs.update_gallery }}" = "true" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
          else
            MSG=$(git log -1 --pretty=%B)
            if echo "$MSG" | grep -qi 'add-to-gallery'; then
              echo "update=true" >> $GITHUB_OUTPUT
            else
              echo "update=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate and deploy pages
        if: steps.changed.outputs.team != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          TEAM_SLUG: ${{ steps.changed.outputs.team }}
          UPDATE_GALLERY: ${{ steps.gallery.outputs.update }}
        run: node scripts/generate-and-deploy.js
