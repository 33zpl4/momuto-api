name: Deploy ES Roundup (Equipaciones Comparativa)

on:
  push:
    branches: [main]
    paths:
      - 'pages/roundup-es'
      - 'scripts/deploy-roundup-es-page.js'
      - '.github/workflows/deploy-roundup-es-page.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write to CMS)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy ES roundup comparativa
        env:
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/deploy-roundup-es-page.js
