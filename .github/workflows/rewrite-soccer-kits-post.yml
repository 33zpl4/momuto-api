name: Rewrite high-quality-soccer-kits Post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — audit only, no writes to CMS'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Rewrite post
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/rewrite-soccer-kits-post.js
