name: Check live robots.txt (five stores)
# Read only. Confirms the deployed robots.txt carries the parameter/preview rules. Also runs a few minutes after Deploy Static Files.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Static Files (robots.txt / llms.txt / sitemap.xml / blog.css)']
    types: [completed]
  push:
    paths: ['scripts/check-live-robots.js', '.github/workflows/check-live-robots.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright && npx playwright install chromium
      - run: node scripts/check-live-robots.js
