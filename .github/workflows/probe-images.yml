name: Probe images (read-only)

# GETs the given image URLs and prints status/type/size/dimensions/hash
# (scripts/probe-images.js). Reads only.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Image URLs, space or comma separated'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: node scripts/probe-images.js
