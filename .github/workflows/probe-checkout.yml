name: Probe checkout path (read-only)

# Anonymous browser on a GitHub runner: product -> add to cart -> /cart -> click checkout, records where it lands and whether it loaded (errors, failed requests,
# screenshots) on all 5 stores, desktop + phone, plus design.momuto.com. Stops at the checkout page: nothing typed, nothing paid. See scripts/probe-checkout.js.
# 'publish_shots' pushes screenshots to the throwaway branch probe-checkout-shots; mode 'cleanup' deletes it.

on:
  push:
    branches: ['claude/clever-mendel-fni5rb']   # TEMP: lets the first run start before the workflow is on main; removed before merge
    paths: ['scripts/probe-checkout.js']
  workflow_dispatch:
    inputs:
      stores:
        description: 'comma list (www,us,es,fr,it,design) or all'
        default: 'all'
      mode:
        description: "'probe' or 'cleanup' (deletes the screenshots branch)"
        default: 'probe'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cleanup
        if: github.event.inputs.mode == 'cleanup'
        run: git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" --delete probe-checkout-shots || echo "branch already gone"
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
        if: github.event.inputs.mode != 'cleanup'
      - run: node scripts/probe-checkout.js
        if: github.event.inputs.mode != 'cleanup'
        env:
          PROBE_STORES: ${{ github.event.inputs.stores || 'all' }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.mode != 'cleanup'
        with:
          name: checkout-probe
          path: probe-checkout-out/
          retention-days: 7
      - name: "Publish screenshots + JSON to the throwaway branch (public pages only)"
        if: always() && github.event.inputs.mode != 'cleanup'
        run: |
          mkdir -p /tmp/shots && cp probe-checkout-out/* /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && ls * >/dev/null 2>&1 || { echo "no output"; exit 0; }
          git init -q && git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add . && git commit -q -m "cart probe ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-checkout-shots
