name: Weekly scorecard

# Every Monday: collects the funnel (anonymous session counters), paid orders, leads, delivery speed, Search Console and repo health,
# appends them to metrics/weekly.json (history in git) and writes metrics/WEEKLY.md + the run summary. Reads only.
# Needs: MOMUTO_API_SECRET (already used by admin-order-email); optional GSC_SERVICE_ACCOUNT (see docs/scorecard.md).

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect and report
        env:
          MOMUTO_API_SECRET: ${{ secrets.MOMUTO_API_SECRET }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/weekly-scorecard.js
      - name: Commit the history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Weekly scorecard $(date -u +%G-W%V) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
