name: Find PayPal mentions (read-only audit)

on:
  workflow_dispatch:
  push:
    branches: [claude/blissful-cerf-d71g6b-no-paypal]
    paths: ['scripts/find-paypal.js', '.github/workflows/find-paypal.yml']

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/find-paypal.js
