name: Patch gallery SEO meta (live read-modify-write)

# Sets title / meta_title / meta_descript / keywords of the 5 live kit-gallery pages (scripts/patch-gallery-meta.js).
# Content is never touched (pipeline-owned cards). Dry run by default: prints OLD → NEW and writes nothing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print OLD → NEW, write nothing)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      stores:
        description: 'Stores, comma list'
        default: 'en,es,fr,it,us'
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          OEMSAAS_TOKEN_US: ${{ secrets.OEMSAAS_TOKEN_US }}
          DRY_RUN: ${{ inputs.dry_run }}
          STORES: ${{ inputs.stores }}
        run: node scripts/patch-gallery-meta.js
