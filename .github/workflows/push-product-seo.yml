name: Push Product SEO (RTP)

# Pushes Ready-to-Play product SEO to the storefront via the OEMSaaS OpenAPI
# /products/batchsave endpoint. Source: ready-to-play/seo/rtp-seo.<locale>.json.
# Partial update — only id + SEO fields are sent; price/variants/media/inner_title
# (the type:3d cart pointer) are left untouched.

on:
  # Click-free: edit ready-to-play/seo/rtp-seo.<locale>.json and push → the
  # changed locale's product SEO is pushed live (the integration token can't
  # trigger workflow_dispatch, so we use a push trigger like the other deploys).
  push:
    branches: [main]
    paths:
      - 'ready-to-play/seo/rtp-seo.*.json'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Store to push to (blank = all that have a SEO json)'
        required: false
        default: 'en'
        type: choice
        options:
          - ''
          - en
          - es
          - fr
          - it
      list_only:
        description: 'List mode (read-only: fetch store, report RTP handle coverage)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (print payload, send nothing)'
        required: false
        default: true
        type: boolean
      handles:
        description: 'Limit to these handles (comma list, e.g. the-apex). Blank = all 14.'
        required: false
        default: ''
        type: string

jobs:
  push-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Push product SEO (dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          TARGET_DOMAIN: ${{ github.event.inputs.domain }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIST_ONLY: ${{ github.event.inputs.list_only }}
          TARGET_HANDLES: ${{ github.event.inputs.handles }}
        run: node scripts/push-product-seo.js

      - name: Push changed product SEO (push, live)
        if: github.event_name == 'push'
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          DRY_RUN: 'false'
        run: |
          BEFORE='${{ github.event.before }}'
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then BEFORE="$(git rev-parse HEAD~1)"; fi
          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'ready-to-play/seo/rtp-seo.*.json')"
          echo "Changed SEO files: $CHANGED"
          for f in $CHANGED; do
            LOC="$(basename "$f" | sed -E 's/rtp-seo\.(en|es|fr|it)\.json/\1/')"
            echo "::group::push $LOC (live)"
            TARGET_DOMAIN="$LOC" DRY_RUN=false node scripts/push-product-seo.js
            echo "::endgroup::"
          done
