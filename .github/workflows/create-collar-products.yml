name: Create Polo-collar products

# Creates the 3.00 "Polo collar" surcharge product on each store (EUR; $3.00
# on us) — the billing vehicle for the polo-collar design option
# (scripts/create-collar-products.js). A push to the
# watched paths runs a DRY RUN only (inputs are empty on push events, and
# --live is added solely when dry_run is the literal string "false") —
# creating for real always takes a manual dispatch with dry_run=false.
# Runs on the GitHub runner (the sandbox cannot reach openapi.oemapps.com).

on:
  push:
    branches: [main]
    paths:
      - 'scripts/create-collar-products.js'
      - '.github/workflows/create-collar-products.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print payloads only, send nothing'
        type: choice
        options: ['true', 'false']
        default: 'true'
      lang:
        description: 'Store to create on'
        type: choice
        options: ['all', 'en', 'es', 'fr', 'it', 'us']
        default: 'all'

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create products
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          OEMSAAS_TOKEN_US: ${{ secrets.OEMSAAS_TOKEN_US }}
        run: |
          FLAGS="--lang ${{ inputs.lang || 'all' }}"
          if [ "${{ inputs.dry_run }}" = "false" ]; then FLAGS="$FLAGS --live"; fi
          node scripts/create-collar-products.js $FLAGS

      - name: Commit ids back
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cms/polo-collar
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "Polo-collar product ids [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
