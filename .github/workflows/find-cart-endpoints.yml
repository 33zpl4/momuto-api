name: Find store cart endpoints (read-only)

# Opens each store's public /cart page in a browser and records its scripts and lists the /homeapi/ endpoints they call. Nothing is posted. See scripts/find-cart-endpoints.js.
# TEMP push trigger on the scratch branch only (the workflow is not on main).

on:
  push:
    branches: ['claude/trace-checkout-handoff']
    paths: ['scripts/find-cart-endpoints.js']
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/find-cart-endpoints.js
        env:
          PROBE_STORES: www
