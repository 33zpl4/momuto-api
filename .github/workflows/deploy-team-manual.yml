name: Deploy Team Page (Manual)

on:
  workflow_dispatch:
    inputs:
      team_slug:
        description: 'Team slug (folder name under teams/)'
        required: true
        type: string
      update_gallery:
        description: 'Also update gallery?'
        required: false
        default: 'false'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk@0.39.0

      - name: Deploy team page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          TEAM_SLUG: ${{ inputs.team_slug }}
          UPDATE_GALLERY: ${{ inputs.update_gallery }}
        run: node scripts/generate-and-deploy.js
