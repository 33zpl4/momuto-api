name: Deploy Ready to Play Page

# The "Ready to Play" wall — the 3D kit designer hub (docs/product-architecture.md).
# All four locales: each wall took over its store's aged collection URL in
# place (4 Aug). EN also retires /pages/the-studio-3d-kit-designer.

on:
  push:
    branches: [main]
    paths:
      - 'pages/ready-to-play'
      - 'pages/coleccion-ready-to-play'
      - 'pages/collection-ready-to-play'
      - 'pages/collezione-ready-to-play'
      - 'scripts/deploy-ready-to-play-page.js'
      - '.github/workflows/deploy-ready-to-play-page.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to CMS)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
        run: node scripts/deploy-ready-to-play-page.js
