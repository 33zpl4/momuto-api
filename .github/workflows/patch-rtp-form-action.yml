name: Patch RTP Template Form Actions

on:
  push:
    branches: [main]
    paths:
      - 'ready-to-play/templates/**/*.html'
      - 'scripts/patch-rtp-form-action.js'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no CMS writes)'
        required: false
        type: boolean
        default: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch RTP form actions
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/patch-rtp-form-action.js
