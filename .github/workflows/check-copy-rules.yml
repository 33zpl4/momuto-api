name: Check copy rules

# Runs the hard rules from CLAUDE.md (deposit copy, one customer email, naming grammar, one set of numbers,
# no real clubs on product surfaces) over every customer-facing file. Fails a PR only on NEW violations;
# the existing ones are recorded in scripts/copy-rules.baseline.json and should only ever shrink.

on:
  pull_request:
    paths:
      - 'pages/**'
      - 'cms/**'
      - 'faq/**'
      - 'policies/**'
      - 'maker/**'
      - 'size-guide/**'
      - 'blogs/**'
      - 'static/shared/**'
      - 'lib/emails.js'
      - 'docs/account-brand/**'
      - 'docs/cart-brand/**'
      - 'scripts/build-cart-brand-entry.js'
      - 'scripts/build-account-brand-entry.js'
      - 'docs/www-us-banner/**'
      - 'scripts/build-www-us-banner-entry.js'
      - 'lib/wa-*'
      - 'public/wa-faq.json'
      - 'public/configurator/pricing.js'
      - 'static/**/llms.txt'
      - 'test/wa-*'
      - 'scripts/build-wa-bot-answers.js'
      - 'scripts/audit-3d-links.js'
      - 'docs/3d-tool-links.*'
      - 'scripts/check-copy-rules.js'
      - 'scripts/check-page-sources.js'
      - 'scripts/check-blog-integrity.js'
      - 'scripts/rebuild-sitemap.js'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check copy rules
        run: node scripts/check-copy-rules.js
      - name: One source per page (no edits to cms/pages copies of pages/ sources, no template copies)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-page-sources.js
      - name: Check the 3D launch-link inventory is current
        run: node scripts/audit-3d-links.js --check
      - name: Account skin paste-in file is current and every CSS rule is scoped
        run: node scripts/build-account-brand-entry.js --check
      - name: www entry (US banner + H1 demotion) generated file is current
        run: node scripts/build-www-us-banner-entry.js --check

      - name: Cart brand entry is current and guarded
        run: node scripts/build-cart-brand-entry.js --check
      - name: WhatsApp bot answers are built from the FAQ (one set of numbers)
        run: node scripts/build-wa-bot-answers.js --check
      - name: WhatsApp bot tests (hours, keywords, handoff, webhook)
        run: node --test test/wa-bot.test.js test/wa-webhook.test.js test/wa-twilio.test.js test/wa-faq-json.test.js test/gift-rule.test.js test/lifecycle-emails.test.js
      - name: Blog integrity (FAQ JSON-LD matches the visible FAQ; ES/FR/IT links point at the locale's handles)
        run: node scripts/check-blog-integrity.js
      - name: Order amounts (the paid total is total_price, after promotions)
        run: node scripts/test-order-amounts.js
