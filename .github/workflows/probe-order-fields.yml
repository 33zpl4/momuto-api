name: Probe order fields (read-only, no personal data)

# Prints the key names and a whitelist of non-personal status fields of ONE order, and optionally which sub-routes exist (GET only).
# Never dumps values: logs on this repo are public. scripts/probe-order-fields.js
on:
  push:
    paths:
      - 'scripts/probe-order-fields.js'
      - 'scripts/probe-order-write-routes.js'
      - '.github/workflows/probe-order-fields.yml'
  workflow_dispatch:
    inputs:
      store:
        description: 'Store'
        default: 'es'
      order_id:
        description: 'Platform order id (not the order number)'
        required: true
      paths:
        description: 'Optional GET paths to test, comma separated'
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          OEMSAAS_TOKEN_US: ${{ secrets.OEMSAAS_TOKEN_US }}
          STORE: ${{ inputs.store || 'es' }}
          ORDER_ID: ${{ inputs.order_id || '33635073' }}
          PATHS: ${{ inputs.paths || '/orders/33635073/payments,/orders/33635073/payment,/orders/33635073/transactions,/orders/33635073/pay,/orders/33635073/paid,/orders/33635073/fulfillments,/orders/33635073/refunds,/orders/33635073/events,/orders/33635073/notes,/orders/33635073/tags' }}
        run: node scripts/probe-order-fields.js
      - name: Which order write routes exist (nonexistent order id, nothing written)
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          STORE: es
        run: node scripts/probe-order-write-routes.js
