name: Fix perche-momuto Links (IT)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scan + report, do not write)'
        required: false
        type: boolean
        default: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan and fix perche-momuto links
        env:
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/fix-perche-momuto-links.js
