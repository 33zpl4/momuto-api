name: Patch live copy

# Exact text replacements on LIVE CMS pages (read live, change only the listed strings, write the same object back, read back).
# For pages whose repo copy may be stale or that are pipeline-owned. Spec files live in scripts/live-copy-fixes/.
# Dry run by default; workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file'
        required: true
        default: 'scripts/live-copy-fixes/2026-10-12.json'
        type: string
      dry_run:
        description: 'Dry run — list only, no writes'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          OEMSAAS_TOKEN_IT: ${{ secrets.OEMSAAS_TOKEN_IT }}
          OEMSAAS_TOKEN_US: ${{ secrets.OEMSAAS_TOKEN_US }}
          SPEC: ${{ inputs.spec }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/patch-live-copy.js
