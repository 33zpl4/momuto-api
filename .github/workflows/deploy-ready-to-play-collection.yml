name: Deploy Ready-to-Play Collection

on:
  push:
    paths:
      - 'ready-to-play/collection/**'
      - 'ready-to-play/config.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no CMS writes)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy collection pages
        env:
          OEMSAAS_TOKEN_EN: ${{ secrets.OEMSAAS_TOKEN_EN }}
          OEMSAAS_TOKEN_ES: ${{ secrets.OEMSAAS_TOKEN_ES }}
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/deploy-ready-to-play-collection.js
