name: Deploy FR Maillot Personnalisé Hub

on:
  push:
    branches: [main]
    paths:
      - 'pages/maillot-foot-personnalise'
      - 'scripts/deploy-maillot-personnalise-page.js'
      - '.github/workflows/deploy-maillot-personnalise-page.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write to CMS)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy FR maillot personnalisé hub
        env:
          OEMSAAS_TOKEN_FR: ${{ secrets.OEMSAAS_TOKEN_FR }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/deploy-maillot-personnalise-page.js
